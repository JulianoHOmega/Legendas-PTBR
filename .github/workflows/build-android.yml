name: Compilar OmegaSub Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Preparar Python para Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compilar APK de teste
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Renomear APK para OmegaSub.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/OmegaSub.apk
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: OmegaSub-Android
          path: android/app/build/outputs/apk/debug/OmegaSub.apk
          if-no-files-found: error
