name: Compilar Linux TAR.GZ

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'assets/**'
      - 'packaging/linux/**'
      - '.github/workflows/build-linux.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Instalar bibliotecas graficas Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 libgl1 libegl1 libdbus-1-3 libfontconfig1 libxrender1 libxi6 libsm6 libice6
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verificar sintaxe e executar testes
        run: |
          python -m compileall -q main.py subtitle_engine.py series_detection.py
          python -m unittest discover -s tests -v
      - name: Compilar aplicativo Linux
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Legendas-PTBR --add-data 'assets/legendas.png:assets' --collect-all subliminal --collect-all babelfish --collect-all guessit --collect-all enzyme main.py
          test -x dist/Legendas-PTBR/Legendas-PTBR
      - name: Criar pacote TAR.GZ
        run: |
          mkdir -p package/Legendas-PTBR
          cp -a dist/Legendas-PTBR/. package/Legendas-PTBR/
          cp packaging/linux/iniciar.sh package/Legendas-PTBR/iniciar.sh
          chmod +x package/Legendas-PTBR/iniciar.sh package/Legendas-PTBR/Legendas-PTBR
          tar -czf Legendas-PTBR-v2.1.1-Linux-x86_64.tar.gz -C package Legendas-PTBR
          test -s Legendas-PTBR-v2.1.1-Linux-x86_64.tar.gz
      - name: Publicar pacote Linux
        uses: actions/upload-artifact@v4
        with:
          name: Legendas-PTBR-Linux-TAR-GZ
          path: Legendas-PTBR-v2.1.1-Linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
