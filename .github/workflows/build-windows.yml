name: Compilar Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'assets/**'
      - '.github/workflows/build-windows.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pefile
      - name: Verificar sintaxe
        run: python -m compileall -q main.py subtitle_engine.py series_detection.py
      - name: Testar pontuacao
        run: python -m unittest discover -s tests -v
      - name: Compilar executavel
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name Legendas-PTBR-v1.7.1 --icon assets/legendas.ico --add-data "assets/legendas.png;assets" --collect-all subliminal --collect-all babelfish --collect-all guessit --collect-all enzyme main.py
          if (!(Test-Path 'dist/Legendas-PTBR-v1.7.1.exe')) { throw 'Executavel nao encontrado' }
          @'
          import pefile
          p = pefile.PE('dist/Legendas-PTBR-v1.7.1.exe')
          icon_count = 0
          if hasattr(p, 'DIRECTORY_ENTRY_RESOURCE'):
              for entry in p.DIRECTORY_ENTRY_RESOURCE.entries:
                  if entry.id == 3:  # RT_ICON
                      icon_count = len(entry.directory.entries)
          print(f'Icon resources embedded: {icon_count}')
          if not icon_count:
              raise SystemExit('ERRO: EXE sem icone incorporado')
          '@ | python -
      - name: Publicar EXE como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Legendas-PTBR-Windows-10
          path: dist/Legendas-PTBR-v1.7.1.exe
          if-no-files-found: error
          retention-days: 30
